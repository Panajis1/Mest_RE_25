# RE production overrides — inherits all defaults from default.yaml
# Update data paths to match your local data layout before running.

data:
  re_data_dir: "data/re_data/ETHZ_ALL"
  metadata_dir: "data/re_data/ETHZ_ALL"

pipeline:
  n_workers: 4 #can be set to "auto" to use all available cores
  batch_size: 500
  autosave_every_n_customers: 2000

detectors:
  enabled:
    - pv
    - battery
    - ac
    - heat_pump
    - ev

models:
  pv:
    capacity_bootstrap_n: 20
  ac:
    prob_threshold: 0.72