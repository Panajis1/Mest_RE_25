[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re_nilm"
version = "0.1.0"
description = "Romande Energie Non-Intrusive Load Monitoring pipeline"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "pyarrow>=11.0,<16",
    "scikit-learn>=1.3,<1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "scipy>=1.10,<2",
    "tqdm>=4.65,<5",
    "psutil>=5.9",
    "plotly>=5.18,<6",
    "requests>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "kaleido>=0.2.1,<0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["re_nilm*"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that run the full pipeline on synthetic data",
]
